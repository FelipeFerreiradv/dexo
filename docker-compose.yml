# Compose adicional para serviços auxiliares do Dexo em DEV.
#
# Não cobre o deploy do app principal (que continua rodando como
# `npm run dev` + `npm run api` localmente, ou via Vercel/etc em
# produção). Apenas o sidecar de remoção de fundo.
#
# Subir:  docker compose up rembg --build
# Parar:  docker compose down

services:
  rembg:
    build: ./infra/rembg
    container_name: dexo-rembg
    ports:
      # SEGURANÇA: bind APENAS em loopback. O sidecar não tem auth/rate-limit;
      # antes "8000:8000" o expunha em 0.0.0.0 (qualquer um na internet podia
      # mandar imagens => DoS). O app (mesmo host) acessa via 127.0.0.1:8000.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # Default 1 worker: o birefnet em CPU é memory-bound (mais workers não
    # aceleraram o lote nos testes); 1 worker = imagem única mais rápida (todos
    # os vCPUs) + menos RAM. Multi-worker fica disponível p/ tunar se o host
    # tiver banda de memória sobrando: suba REMBG_WORKERS (x OMP_NUM_THREADS ~=
    # vCPUs) e o mem_limit (~8.5GB/worker). Tunável aqui sem rebuild.
    environment:
      REMBG_WORKERS: "1"
      OMP_NUM_THREADS: "8"
      # A1 (Camada A): sessao ONNX tunada. O rembg setava intra=inter=8 em 8
      # vCPU memory-bound => oversubscription (jitter, ~11s/p95~16s). Com
      # execution_mode SEQUENTIAL, inter_op=1 e intra_op=6 (joelho medido no
      # KVM8): mediana ~9s e p95 colapsado (~9s isolado). Mesmo modelo/saida
      # (gate SSIM 24/24 verde). Reverter = REMBG_ORT_TUNE=false. OMP_NUM_THREADS
      # segue 8 (so afeta cv2/numpy do refino/sombra, intocados).
      REMBG_ORT_TUNE: "true"
      REMBG_INTRA_OP_THREADS: "6"
      # Limita as arenas do malloc do glibc (a imagem é python:3.11-slim =>
      # Debian/glibc; em Alpine/musl isto seria inerte).
      #
      # POR QUÊ: o glibc cria até 8 x nº de núcleos arenas, uma por thread que
      # aloca. Com OMP_NUM_THREADS=8 + intra_op=6, cada arena fragmenta por
      # conta própria e o RSS nunca volta pro SO. Em 2026-07-21 o container
      # apanhou 4 OOM kills em 53 min com anon-rss ~11,9GiB contra o limite de
      # 12g (dmesg: constraint=CONSTRAINT_MEMCG) — o host estava folgado, era o
      # cgroup do container. Cada kill mata a requisição em voo, o que aparecia
      # no log do app como `socket hang up` / `read ECONNRESET`.
      #
      # 2 arenas é o valor consagrado para workload multi-thread com alocações
      # GRANDES e POUCAS (tensores do ONNX, arrays do cv2/numpy do refino e da
      # sombra) — não há disputa relevante de malloc nesse perfil.
      #
      # Aplicar SEM rebuild: docker compose --env-file /dev/null up -d rembg
      # Reverter: apagar esta linha + o mesmo comando.
      MALLOC_ARENA_MAX: "2"
      # ⚠️ MANTER "false" — TENTADO E REVERTIDO em producao 24/07: desligar a
      # arena do ONNX Runtime elimina o ratchet de RSS e a saida e' bit-identica
      # (golden SSIM 1.0000), MAS a inferencia fica MUITO mais lenta (alocacao
      # por Run em modelo memory-bound): cluster de timeouts de ~42s (orcamento
      # inteiro) mesmo com fila vazia, ~34 inferencias/45min com CPU cravado.
      # O ratchet fica contido por mem_limit 16g + MALLOC_ARENA_MAX + retry de
      # conexao no app. Proxima mitigacao candidata: reciclagem controlada do
      # worker (uvicorn --limit-max-requests) — runbook 8.5 item 3.
      REMBG_ORT_DISABLE_ARENA: "false"
      # Offload da inferencia p/ thread (event loop livre => /health responde
      # durante inferencia) + backpressure explicito: 503 imediato quando a
      # fila interna passa de REMBG_MAX_PENDING (o app degrada graceful em
      # 5xx). DORMENTE por default; ativar so apos golden/bench com flag ON.
      REMBG_ASYNC_OFFLOAD: "false"
      REMBG_MAX_PENDING: "8"
      # Profiling ligado TEMPORARIAMENTE (estabilizacao do incidente 24/07):
      # imprime [rembg-profile] com o tempo de cada estagio por requisicao.
      # Desligar (remover a linha + up -d) apos ~1 semana estavel.
      REMBG_PROFILE: "true"
      # Anti-ZUMBI (incidente 24/07 tarde): descarta em ms requisicoes cujo
      # caller ja desistiu (axios ~42s) em vez de inferir para ninguem — era o
      # combustivel do colapso de congestao. Semantica: so elimina desperdicio.
      REMBG_SKIP_DISCONNECTED: "true"
      # Cap do custo do blur da sombra (incidente 24/07: "imagem-veneno" com
      # bbox de quadro inteiro => sigma ~72 => shadow=34s medido por profile;
      # com cap 12, blur roda em canvas reduzido e re-amplia — visualmente
      # identico p/ sombra suave, custo em ms).
      REMBG_SHADOW_SIGMA_CAP: "12"
      # Cap defensivo de pixels: o app manda <=1600px (~2MP), NUNCA e' afetado.
      # Protege o worker unico de callers diretos full-res (12MP+ = minutos).
      REMBG_MAX_INPUT_MP: "6"
      # Pos-processamento topologico da mascara (PR 2 da remocao universal):
      # descarta componentes parasitas (limiar RELATIVO — multi-parte legitima
      # sobrevive), preenche furos-RUIDO (furo real de parafuso preservado) e
      # colapsa o bbox que dimensiona o custo da sombra (cauda de 17-48s em
      # prod POS-sigma-cap vinha de alpha espalhado pelo quadro). LIGAR SOMENTE
      # apos o gate golden /golden/core passar com a flag ON (exige rebuild:
      # up -d --build). Tunables REMBG_MASK_* documentados no README e em
      # mask_postprocess.py. A supressao de sombra projetada REAL e' flag
      # SEPARADA e experimental — nunca ligar junto com o primeiro rollout.
      # LIGADA em 29/07 apos gate golden pelo criterio VISUAL aprovado pelo
      # Felipe no PR #212 (38/38: SSIM min 0,9991, MAE max 0,053; com a flag
      # OFF a saida e' md5 byte-identica — provado na Fase 0). Rollback sem
      # rebuild: "false" + `docker compose --env-file /dev/null up -d rembg`.
      REMBG_MASK_POSTPROCESS: "true"
      REMBG_MASK_SHADOW_SUPPRESS: "false"
      # Score de confianca da mascara (PR 3 — MODO OBSERVACAO): "true" expoe
      # X-Rembg-Confidence/X-Rembg-Signals (sinais baratos sobre o alpha
      # final; ~10-30ms). NAO muda pixel nem decisao — o app Node so loga a
      # decisao hipotetica ([rembg-confidence] ... WOULD_REROUTE) quando
      # REMBG_CONFIDENCE_LOG=true no .env. Ligado em producao em 30/07 para a
      # janela de observacao de 48h — a distribuicao real calibra o limiar
      # ANTES de qualquer roteamento existir. Rollback sem rebuild: "false" +
      # `docker compose up -d rembg`.
      REMBG_CONFIDENCE: "true"
    # ⚠️ PONTE do incidente 2026-07-24 (era 12g): o ratchet de RSS (glibc +
    # arena do ONNX) leva o container a OOM kill sob carga contínua (medido
    # 21/07: 11,9GiB/12g, 4 kills em 53min, CONSTRAINT_MEMCG). 16g compra horas
    # de runway por ciclo enquanto o fix raiz (REMBG_ORT_DISABLE_ARENA acima)
    # é validado e ligado. Pré-condição: host com MemAvailable ≥ 10GiB (senão
    # usar 14g). REVERTER para 12g após 48h de RSS em platô ≤9GiB com a arena
    # OFF. O aviso original continua valendo: crescimento ILIMITADO + limite
    # alto move o OOM do container para o HOST (derruba API/frontend juntos) —
    # por isso a ponte é temporária e monitorada (docker stats + dmesg).
    # Ver Passo 8.5 do infra/hardening/RUNBOOK_VPS.md.
    mem_limit: 16g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health').read(); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
