# Compose adicional para serviços auxiliares do Dexo em DEV.
#
# Não cobre o deploy do app principal (que continua rodando como
# `npm run dev` + `npm run api` localmente, ou via Vercel/etc em
# produção). Apenas o sidecar de remoção de fundo.
#
# Subir:  docker compose up rembg --build
# Parar:  docker compose down

services:
  rembg:
    build: ./infra/rembg
    container_name: dexo-rembg
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Workers paralelos aceleram o upload em LOTE. REMBG_WORKERS x
    # OMP_NUM_THREADS ~= nº de vCPUs (default 2 x 4 = 8, p/ o KVM8). Tunável
    # aqui sem rebuild (só `docker compose up -d rembg`).
    environment:
      REMBG_WORKERS: "2"
      OMP_NUM_THREADS: "4"
    # Pico ~8.5GB POR worker (birefnet) => 2 workers ~17GB; 20g cobre c/ folga
    # no KVM8/32GB. Se subir p/ 3 workers (~25GB), aumente p/ ~28g.
    mem_limit: 20g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health').read(); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
