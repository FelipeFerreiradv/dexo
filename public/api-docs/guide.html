<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dexo — Guia de integração</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <style>
      :root {
        --fg: #1f2937;
        --muted: #4b5563;
        --bg: #fafafa;
        --code-bg: #f3f4f6;
        --border: #e5e7eb;
        --accent: #1d4ed8;
      }
      html, body { background: var(--bg); }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: var(--fg);
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }
      .topbar {
        background: #1f2937;
        color: #fff;
        margin: -32px -20px 24px;
        padding: 14px 24px;
        font-size: 14px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .topbar a { color: #93c5fd; text-decoration: none; }
      .topbar a:hover { text-decoration: underline; }
      h1, h2, h3, h4 { line-height: 1.25; }
      h1 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
      h2 { font-size: 22px; margin-top: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
      h3 { font-size: 18px; margin-top: 24px; }
      a { color: var(--accent); }
      code {
        background: var(--code-bg);
        padding: 1px 5px;
        border-radius: 3px;
        font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
        font-size: 0.92em;
      }
      pre {
        background: #1f2937;
        color: #f9fafb;
        padding: 14px 16px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 13px;
      }
      pre code { background: transparent; color: inherit; padding: 0; }
      blockquote {
        border-left: 4px solid #f59e0b;
        background: #fff7ed;
        margin: 16px 0;
        padding: 8px 16px;
        color: #78350f;
        border-radius: 0 4px 4px 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 16px 0;
        font-size: 14px;
      }
      th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
      th { background: #f3f4f6; }
      hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
      ul, ol { padding-left: 24px; }
      .loading { color: var(--muted); font-style: italic; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <strong>Dexo</strong>
      <span>·</span>
      <a href="./index.html">← Spec OpenAPI (Swagger UI)</a>
      <a href="./INTEGRATION-GUIDE.md">Markdown cru</a>
    </div>
    <article id="content"><p class="loading">Carregando guia…</p></article>

    <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
    <script>
      (async () => {
        const target = document.getElementById("content");
        try {
          const res = await fetch("./INTEGRATION-GUIDE.md");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const md = await res.text();
          target.innerHTML = marked.parse(md, { gfm: true, breaks: false });
          // Anchor links em headings
          for (const h of target.querySelectorAll("h2, h3, h4")) {
            const id = h.textContent.toLowerCase()
              .replace(/[^\w\sá-úà-ùâ-ûã-õç-]/g, "")
              .replace(/\s+/g, "-");
            h.id = id;
          }
        } catch (err) {
          target.innerHTML = `<p style="color:#b91c1c">Falha ao carregar o guia: ${err.message}.<br>Tente <a href="./INTEGRATION-GUIDE.md">o markdown cru</a>.</p>`;
        }
      })();
    </script>
  </body>
</html>
