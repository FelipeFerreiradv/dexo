openapi: 3.0.3

info:
  title: Dexo API — Product & Listing Creation
  version: 1.1.0
  license:
    name: Proprietary
    url: https://usedexo.com.br/
  description: |
    > Contrato dos fluxos de criação de produto e anúncio (Mercado Livre + Shopee).


    Especificação OpenAPI 3.0 dos endpoints do Dexo relacionados à
    **criação de produtos internos** e à **publicação de anúncios** em Mercado Livre
    e Shopee, mais os endpoints auxiliares necessários para esse fluxo (upload de
    imagem, sugestão de categoria, ficha técnica, compatibilidade veicular, contas
    conectadas, autenticação OAuth dos marketplaces).

    Esta documentação tem como público-alvo principal **sistemas externos integradores**,
    em particular o **Desmont Hub**. Para o passo-a-passo recomendado de integração,
    veja o documento [`INTEGRATION-GUIDE.md`](./INTEGRATION-GUIDE.md).

    ## Escopo desta spec

    - **Inclui**: criação de produto (`POST /products`), criação de anúncio unitário
      (ML/Shopee), criação em massa (bulk), dispatch assíncrono, polling de status,
      preflight de validação, retry de itens falhos, e todos os endpoints auxiliares
      consumidos no caminho feliz desses fluxos.
    - **Não inclui**: gestão de pedidos, financeiro, fiscal/NF-e, mensagens,
      dashboard, sucata e demais domínios — esses módulos não estão no contrato
      público desta versão e podem mudar sem aviso.

    ## Stack & convenções

    - Servidor: **Fastify 5** standalone (porta `3333`).
    - Banco de dados: PostgreSQL via Prisma.
    - Autenticação da API: `Bearer` JWT (preferido) ou header `email` legado
      (ver `securitySchemes.BearerAuth` / `securitySchemes.EmailAuth`).
    - Autenticação dos marketplaces: OAuth 2.0 (configurado **uma vez por usuário** —
      ver tag `Authentication & Accounts`).
    - Datas: ISO-8601 UTC.
    - IDs: strings (cuid/uuid; não assumir formato).
    - Idempotência: SKU é único por usuário; `POST /products` repetido com mesmo SKU
      retorna `409 Conflict`.

    ## Versionamento

    Este contrato segue versionamento semântico no campo `info.version`. Mudanças
    breaking incrementam o major. O changelog vive em `docs/api/README.md`.
  contact:
    name: Dexo — equipe de produto
    email: fefelbf@gmail.com

servers:
  - url: https://api.usedexo.com.br
    description: |
      Produção (`https://usedexo.com.br/` é o frontend que consome esta API).
  - url: http://localhost:3333
    description: |
      Desenvolvimento local (`npm run api`). Também é o ambiente de "staging"
      hoje — não há staging dedicado.

tags:
  - name: Authentication & Accounts
    description: |
      Autenticação interna (header `email`) e fluxo OAuth para conectar contas
      Mercado Livre e Shopee. **Pré-requisito de configuração** antes de qualquer
      criação de anúncio.
  - name: Products
    description: Criação, listagem e leitura de produtos internos.
  - name: Listings — single
    description: |
      Criação unitária de anúncios em ML/Shopee, dispatch multi-marketplace
      assíncrono e polling de status.
  - name: Listings — bulk
    description: |
      Criação em massa (até 2000 anúncios por job), preflight de validação,
      consulta de progresso e retry de itens falhos.
  - name: Marketplace — Categories & Catalog
    description: |
      Categorias ML/Shopee, atributos (ficha técnica), sugestões e detalhes do
      catálogo do Mercado Livre.
  - name: Compatibilities
    description: Compatibilidade veicular dos produtos (CRUD).
  - name: Uploads
    description: Upload de imagens (pré-requisito antes de criar produto).
  - name: Image Processing
    description: |
      Processamento de imagem **stateless** — remoção de fundo e sombra de
      contato — exposto como serviço reutilizável por sistemas externos
      (ex.: Desmont Hub). Reaproveita o mesmo pipeline do upload de produto,
      mas devolve os **bytes** da imagem na resposta e **não persiste** nada
      no servidor.

security:
  - EmailAuth: []

paths:
  # ──────────────────────────────────────────────────────────────────
  # Authentication & Accounts
  # ──────────────────────────────────────────────────────────────────

  /marketplace/ml/auth:
    post:
      tags: [Authentication & Accounts]
      operationId: initiateMLOAuth
      summary: Inicia o fluxo OAuth do Mercado Livre
      description: |
        Gera uma URL de autorização do Mercado Livre (com PKCE) que o **usuário final**
        deve abrir no navegador. Após autorizar, o ML redireciona para
        `/marketplace/ml/callback` e a conta fica registrada como `MarketplaceAccount`
        ativa para esse `userId`.

        **Quando usar**: uma única vez por usuário (ou para reconectar uma conta
        revogada). Não é parte do fluxo de criação de produto/anúncio.
      responses:
        "200":
          description: URL de autorização gerada
          content:
            application/json:
              schema:
                type: object
                required: [authUrl, state]
                properties:
                  authUrl:
                    type: string
                    format: uri
                    description: URL para redirecionar o navegador do usuário
                  state:
                    type: string
                    description: Token CSRF/PKCE (TTL ~10 min)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /marketplace/ml/callback:
    get:
      tags: [Authentication & Accounts]
      operationId: completeMLOAuth
      summary: Callback OAuth do Mercado Livre
      description: |
        Endpoint chamado **pelo navegador do usuário** após autorização no ML.
        Troca `code` por tokens, persiste a `MarketplaceAccount` e redireciona
        para `/integracoes/mercado-livre/callback?result=success`.

        **Não é chamado por sistemas externos.** Documentado apenas para visibilidade.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect para a página de callback do frontend
        "400":
          $ref: "#/components/responses/BadRequest"

  /marketplace/shopee/auth:
    post:
      tags: [Authentication & Accounts]
      operationId: initiateShopeeOAuth
      summary: Inicia o fluxo OAuth do Shopee
      description: |
        Análogo a `/marketplace/ml/auth`. Usa assinatura HMAC-SHA256 do Shopee.
      responses:
        "200":
          description: URL de autorização gerada
          content:
            application/json:
              schema:
                type: object
                required: [authUrl, state]
                properties:
                  authUrl: { type: string, format: uri }
                  state: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /marketplace/ml/status:
    get:
      tags: [Authentication & Accounts]
      operationId: getMLStatus
      summary: Verifica status da conta Mercado Livre conectada
      description: |
        Use **antes de criar anúncios ML** para garantir que existe ao menos uma
        conta ativa. Se `connected=false`, direcione o usuário ao fluxo OAuth.
      responses:
        "200":
          description: Status retornado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /marketplace/shopee/status:
    get:
      tags: [Authentication & Accounts]
      operationId: getShopeeStatus
      summary: Verifica status da conta Shopee conectada
      responses:
        "200":
          description: Status retornado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /marketplace/ml/accounts:
    get:
      tags: [Authentication & Accounts]
      operationId: listMLAccounts
      summary: Lista contas Mercado Livre conectadas
      description: |
        Retorna todas as contas ML do usuário autenticado. Use para popular
        o campo `accountId` ao criar anúncios.
      responses:
        "200":
          description: Lista de contas
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /marketplace/shopee/accounts:
    get:
      tags: [Authentication & Accounts]
      operationId: listShopeeAccounts
      summary: Lista contas Shopee conectadas
      description: |
        Retorna todas as contas Shopee. Cada conta é enriquecida com `shopId`,
        `shopName` e `region` via chamada ao `ShopeeApiService.getShopInfo()`.
      responses:
        "200":
          description: Lista de contas
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────────────────────────
  # Products
  # ──────────────────────────────────────────────────────────────────

  /products:
    post:
      tags: [Products]
      operationId: createProduct
      summary: Cria um novo produto interno (e opcionalmente dispara anúncios)
      description: |
        Endpoint **central** do fluxo. Cria o produto no banco interno e, se
        `listings[]` ou `createListing=true` forem informados, dispara em background
        (`fire-and-forget`) a criação dos anúncios em ML e/ou Shopee via
        `ListingDispatcher.dispatch()`.

        ## Quando usar
        - **Use este endpoint** quando você quer cadastrar um produto novo —
          mesmo que não vá publicar anúncio agora (basta omitir `listings`).
        - Para publicar anúncios para um produto **que já existe**, use
          `POST /listings/dispatch` ou `POST /listings/ml` / `POST /listings/shopee`.

        ## Pré-condições
        1. Header `email` válido (usuário existente).
        2. Imagem já enviada via `POST /upload/image` (você precisa do `imageUrl`).
        3. Para criar anúncio **ML**: categoria ML resolvida (campo `mlCategory`
           ou `listings[].categoryId`); a categoria precisa estar **sincronizada**
           no banco local (caso contrário, retorna `400`).
        4. Para criar anúncio **Shopee**: categoria Shopee informada e que seja
           **categoria folha** (não-pai) — recomendamos rodar
           `POST /listings/bulk/preflight` antes em caso de dúvida.
        5. Para anúncios em **qualquer marketplace**: ao menos uma conta ativa
           desse marketplace conectada (ver `GET /marketplace/{ml|shopee}/status`).

        ## Resposta assíncrona
        A resposta `201` retorna **antes** dos anúncios serem efetivamente publicados.
        O campo `listing.pending = true` indica que há anúncio sendo criado em
        background. Use `GET /listings/status?productId=...` para fazer polling
        do resultado real.

        ## Validação
        - `sku`: obrigatório, string, único por usuário (caso já exista → `409`).
        - `name`: obrigatório, string.
        - `price`: obrigatório, número >= 0.
        - `stock`: obrigatório, inteiro >= 0.
        - `imageUrl`: obrigatório, URL válida (use `POST /upload/image`).
        - `compatibilities[]`: cada item exige `brand` e `model`; `yearFrom/yearTo`
          aceitam `null`.
        - `attributes`: mapa `{ [attributeId]: { value_id?, value_name? } }`;
          entradas vazias são descartadas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCreate" }
            examples:
              minimo:
                summary: Produto mínimo, sem anunciar
                value:
                  sku: DEXO-00001
                  name: Mangueira de radiador Gol G5 1.0
                  price: 89.9
                  stock: 3
                  imageUrl: http://localhost:3333/uploads/abc.jpg
              completoComAnuncios:
                summary: Produto autopeças completo, com anúncios em ML e Shopee
                value:
                  sku: DEXO-00042
                  name: "Mangueira radiador Gol G5 1.0 8V 2008-2014"
                  description: "Mangueira superior do radiador, original/usada em bom estado."
                  price: 89.9
                  costPrice: 35.0
                  markup: 1.57
                  stock: 2
                  brand: Volkswagen
                  model: Gol
                  year: "2010"
                  version: "1.0 8V"
                  partNumber: "5U0121049"
                  quality: SEMINOVO
                  isSecurityItem: false
                  isTraceable: false
                  sourceVehicle: "Gol G5 2010 sucateado em 2026-04"
                  heightCm: 12
                  widthCm: 8
                  lengthCm: 45
                  weightKg: 0.4
                  imageUrl: http://localhost:3333/uploads/abc.jpg
                  imageUrls:
                    - http://localhost:3333/uploads/abc.jpg
                    - http://localhost:3333/uploads/def.jpg
                  mlCategory: MLB252712
                  shopeeCategory: "100018"
                  attributes:
                    BRAND: { value_id: "9344", value_name: "Volkswagen" }
                    PART_NUMBER: { value_name: "5U0121049" }
                  compatibilities:
                    - { brand: Volkswagen, model: Gol, yearFrom: 2008, yearTo: 2014, version: "1.0 8V" }
                  listings:
                    - platform: MERCADO_LIVRE
                      categoryId: MLB252712
                      accountIds: ["acc_ml_01"]
                      listingType: gold_special
                      itemCondition: used
                      hasWarranty: true
                      warrantyUnit: dias
                      warrantyDuration: 30
                      shippingMode: me2
                      freeShipping: false
                      manufacturingTime: 1
                    - platform: SHOPEE
                      categoryId: "100018"
                      accountIds: ["acc_shopee_01"]
      responses:
        "201":
          description: Produto criado. Anúncios (se solicitados) estão sendo criados em background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductCreateResponse" }
        "400":
          description: Validação cliente (SKU/nome/preço/estoque/imagem inválidos ou categoria inexistente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                semCategoriaML:
                  value:
                    error: "Produto não possui categoria do Mercado Livre. Selecione uma categoria antes de criar o anúncio."
                semImagem:
                  value: { error: "Imagem do produto é obrigatória" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: SKU já existe para este usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: "Produto com esse sku já existe"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/next-sku:
    get:
      tags: [Products]
      operationId: getNextSku
      summary: Retorna o próximo SKU sequencial sugerido
      description: |
        Útil para pré-popular o campo `sku` em formulários ou para integração
        Desmont Hub que não controla a numeração. SKUs aceitam o regex
        `^[A-Za-z0-9-_]+$` (max 50 chars), mas você pode usar um padrão próprio
        do Desmont (ex.: `DESMONT-{externalId}`) — o ideal é manter
        rastreabilidade reversa.
      responses:
        "200":
          description: SKU sugerido
          content:
            application/json:
              schema:
                type: object
                required: [sku]
                properties:
                  sku: { type: string, example: "DEXO-00043" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/filter-options:
    get:
      tags: [Products]
      operationId: getProductFilterOptions
      summary: Opções para popular formulário (marcas e categorias publicadas)
      responses:
        "200":
          description: Opções
          content:
            application/json:
              schema:
                type: object
                properties:
                  brands:
                    type: array
                    items: { type: string }
                  publishedCategories:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                        platform: { type: string, enum: [MERCADO_LIVRE, SHOPEE] }
                        categoryId: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────────────────────────
  # Listings — single
  # ──────────────────────────────────────────────────────────────────

  /listings/ml:
    post:
      tags: [Listings — single]
      operationId: createMLListing
      summary: Cria um anúncio unitário no Mercado Livre
      description: |
        Cria um anúncio para um produto **já existente** em uma conta ML específica.

        ## Quando usar
        - Quando o produto já foi criado via `POST /products` mas **sem** anunciar.
        - Para anunciar em conta adicional após o cadastro.
        - Para anunciar uma única plataforma — para multi-marketplace, prefira
          `POST /listings/dispatch` (assíncrono e atômico no contrato).

        ## Pré-condições
        - Produto existe no banco interno (`productId`).
        - Conta ML ativa (`accountId` obrigatório aqui).
        - Categoria pode ser omitida se o produto já tem `mlCategoryId` resolvido;
          caso contrário, é tentada uma sugestão automática via `domain_discovery`
          dentro do `ListingUseCase`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMLListingRequest" }
            examples:
              tipico:
                value:
                  productId: prod_abc123
                  accountId: acc_ml_01
                  categoryId: MLB252712
                  listingType: gold_special
                  itemCondition: used
                  hasWarranty: true
                  warrantyUnit: dias
                  warrantyDuration: 30
                  shippingMode: me2
                  freeShipping: false
                  manufacturingTime: 1
              minimo:
                value:
                  productId: prod_abc123
                  accountId: acc_ml_01
      responses:
        "201":
          description: Anúncio criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateListingResponse" }
        "400":
          description: Falha de validação ou erro reportado pelo Mercado Livre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /listings/shopee:
    post:
      tags: [Listings — single]
      operationId: createShopeeListing
      summary: Cria um anúncio unitário na Shopee
      description: |
        Análogo a `/listings/ml`, mas para Shopee. **Importante**: a categoria
        Shopee precisa ser **categoria folha** (não-pai), caso contrário a Shopee
        rejeita o `add_item`. Use `POST /listings/bulk/preflight` para validar antes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShopeeListingRequest" }
            examples:
              tipico:
                value:
                  productId: prod_abc123
                  accountId: acc_shopee_01
                  categoryId: "100018"
      responses:
        "201":
          description: Anúncio criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateListingResponse" }
        "400":
          description: "Falha de validação ou erro reportado pela Shopee (ex.: categoria não-folha)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /listings/dispatch:
    post:
      tags: [Listings — single]
      operationId: dispatchListings
      summary: Dispara criação assíncrona multi-marketplace para 1 produto
      description: |
        Orquestrador único: enfileira a criação de N anúncios (combinações
        marketplace × conta × categoria) para um único produto e retorna
        **imediatamente** com o snapshot do que foi enfileirado.

        ## Quando usar
        - Multi-marketplace ao mesmo tempo (ML + Shopee).
        - Múltiplas contas do mesmo marketplace.
        - Quando você não pode bloquear seu cliente esperando o ML/Shopee
          responder (10–30s típico).

        Para acompanhar o resultado, use `GET /listings/status?productId=...`.

        ## Diferença de `/listings/bulk`
        - `/listings/dispatch` = **1 produto, N anúncios** (rápido, sem job persistido).
        - `/listings/bulk` = **N produtos, M anúncios cada** (cria `BulkListingJob`
          rastreável, retentável).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchListingsRequest" }
            examples:
              mlEShopee:
                value:
                  productId: prod_abc123
                  requests:
                    - platform: MERCADO_LIVRE
                      accountId: acc_ml_01
                      categoryId: MLB252712
                      mlSettings:
                        listingType: gold_special
                        itemCondition: used
                        hasWarranty: true
                        warrantyUnit: dias
                        warrantyDuration: 30
                        shippingMode: me2
                    - platform: SHOPEE
                      accountId: acc_shopee_01
                      categoryId: "100018"
      responses:
        "202":
          description: Enfileirado. Resultado virá via polling.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  queued:
                    type: array
                    items:
                      type: object
                      properties:
                        platform: { type: string, enum: [MERCADO_LIVRE, SHOPEE] }
                        accountId: { type: string, nullable: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /listings/status:
    get:
      tags: [Listings — single]
      operationId: getListingsStatus
      summary: Estado atual dos anúncios de um produto (para polling)
      description: |
        Retorna o snapshot dos `ProductListing` desse produto, incluindo `status`,
        `permalink`, `lastError`, `retryAttempts` e `nextRetryAt` (se aplicável).

        Recomendado: polling com backoff exponencial (1s → 2s → 5s → 10s) por até
        ~60s após `POST /products` ou `POST /listings/dispatch`. Após esse tempo,
        anúncios em estado `PENDING` continuam sendo retentados por
        `ListingRetryService` automaticamente.
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status retornado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingsStatusResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Produto não encontrado para este usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────────────────────────
  # Listings — bulk
  # ──────────────────────────────────────────────────────────────────

  /listings/bulk/preflight:
    post:
      tags: [Listings — bulk]
      operationId: preflightBulkListings
      summary: Valida produtos antes do envio em massa (Shopee category leaf)
      description: |
        Verifica os principais motivos de rejeição da Shopee **antes** de criar o
        job de bulk:

        - `shopee_category_missing`: produto não tem `shopeeCategoryId`.
        - `shopee_category_not_leaf`: a categoria informada é categoria-pai
          (Shopee só aceita categoria folha em `add_item`).

        Se você não vai publicar na Shopee, omita `shopeeAccountId` e o preflight
        retorna `issues: []` direto (Shopee não é validada).

        **Reusa cache de 1h em `ShopeeApiService.assertLeafCategory`** — barato
        mesmo com centenas de produtos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productIds]
              properties:
                shopeeAccountId:
                  type: string
                  description: Conta Shopee usada para validar a árvore de categorias
                productIds:
                  type: array
                  minItems: 1
                  items: { type: string }
            example:
              shopeeAccountId: acc_shopee_01
              productIds: [prod_a, prod_b, prod_c]
      responses:
        "200":
          description: Lista de problemas encontrados (vazia = tudo OK)
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                      required: [productId, code, message]
                      properties:
                        productId: { type: string }
                        code:
                          type: string
                          enum: [shopee_category_missing, shopee_category_not_leaf]
                        message: { type: string }
        "400":
          description: Conta Shopee inválida ou productIds malformados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /listings/bulk:
    post:
      tags: [Listings — bulk]
      operationId: createBulkListings
      summary: Cria job de criação em massa de anúncios
      description: |
        Cria um `BulkListingJob` e dispara processamento em background.
        Retorna `202` com `jobId` imediatamente. O cliente acompanha via
        `GET /listings/bulk/{jobId}`.

        ## Limite

        `productIds.length × requests.length <= 2000`. Lotes maiores precisam ser
        particionados pelo cliente.

        ## Override template

        Permite aplicar transformações em todos os produtos do lote (ex.:
        sufixar título, multiplicar preço, etc.) — útil para criar anúncios em
        marketplace adicional reaproveitando o mesmo produto interno com pequenas
        adaptações.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBulkListingsRequest" }
            examples:
              tipico:
                value:
                  productIds: [prod_a, prod_b, prod_c]
                  requests:
                    - platform: MERCADO_LIVRE
                      accountId: acc_ml_01
                      mlSettings:
                        listingType: gold_special
                        itemCondition: used
                    - platform: SHOPEE
                      accountId: acc_shopee_01
              comOverride:
                value:
                  productIds: [prod_a, prod_b]
                  requests:
                    - platform: MERCADO_LIVRE
                      accountId: acc_ml_02
                  overrideTemplate:
                    titleSuffix: " - Loja Premium"
                    priceFactor: 1.10
      responses:
        "202":
          description: Job criado e iniciado em background
          content:
            application/json:
              schema:
                type: object
                required: [success, jobId, totalItems]
                properties:
                  success: { type: boolean }
                  jobId: { type: string }
                  totalItems: { type: integer, example: 6 }
        "400":
          description: Validação (productIds vazio, requests inválido, limite excedido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /listings/bulk/{jobId}:
    get:
      tags: [Listings — bulk]
      operationId: getBulkListingJob
      summary: Estado completo de um job de bulk listing
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Estado do job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkListingJob" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job não encontrado para este usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
        "500":
          $ref: "#/components/responses/InternalError"

  /listings/bulk/{jobId}/retry-failed:
    post:
      tags: [Listings — bulk]
      operationId: retryFailedBulkListings
      summary: Re-enfileira itens com falha em um NOVO job
      description: |
        Cria um job filho contendo apenas os itens com `success=false` do job
        original. Mantém o `overrideTemplate` original. O job pai não é alterado.

        Use após corrigir o problema raiz (ex.: ajustar `shopeeCategoryId`,
        sincronizar categoria ML, completar OAuth de uma conta) — caso contrário
        o retry vai falhar pelos mesmos motivos.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Novo job criado
          content:
            application/json:
              schema:
                type: object
                required: [success, jobId, totalItems, parentJobId]
                properties:
                  success: { type: boolean }
                  jobId: { type: string, description: ID do NOVO job }
                  totalItems: { type: integer }
                  parentJobId: { type: string, description: ID do job original }
        "400":
          description: Não há itens falhos para reprocessar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job pai não encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
        "500":
          $ref: "#/components/responses/InternalError"

