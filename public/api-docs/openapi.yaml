      tags: [Marketplace — Categories & Catalog]
      operationId: listMLCategories
      summary: Lista categorias do Mercado Livre (cache 600s)
      description: |
        Retorna o universo de categorias ML (já flatten) sincronizadas no banco
        local. Use para popular um seletor.

        Cache: `Cache-Control: private, max-age=600`.
      responses:
        "200":
          description: Lista de categorias
          headers:
            Cache-Control:
              schema: { type: string, example: "private, max-age=600" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
