  /marketplace/ml/catalog/suggestions:
    get:
      tags: [Marketplace — Categories & Catalog]
      operationId: suggestMLCatalogProducts
      summary: Sugere catalog products do ML (fail-open)
      description: |
        Retorna catalog products do Mercado Livre que casam com a query informada.
        Útil para pré-popular ficha técnica e compatibilidades a partir do catálogo
        oficial do ML.

        - `q` é truncada e exige no mínimo 3 chars (abaixo disso, retorna
          `{ suggestions: [] }`).
