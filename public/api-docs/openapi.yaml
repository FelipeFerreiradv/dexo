          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Sugestões (pode estar vazia)
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/MLCatalogProduct" }
