  # ──────────────────────────────────────────────────────────────────
  # Uploads
  # ──────────────────────────────────────────────────────────────────

  /upload/image:
    post:
      tags: [Uploads]
      operationId: uploadProductImage
      summary: Faz upload de imagem (multipart)
      description: |
        Pré-requisito antes de criar produto. Aceita JPEG/PNG/WebP, até **20 MB**.

        ## Auth

        Este endpoint **exige autenticação** (`authMiddleware`): envie um token
        `Authorization: Bearer <jwt>` ou, no modo legacy, o header `email`.

        ## Resposta

        Retorna `imageUrl` absoluta — use exatamente esse valor em `imageUrl`
        e `imageUrls[]` ao chamar `POST /products`.
      security:
        - BearerAuth: []
        - EmailAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagem (JPEG/PNG/WebP, até 20MB). O nome do campo é flexível.
      responses:
        "200":
          description: Upload concluído
          content:
            application/json:
              schema:
                type: object
                required: [success, imageUrl, fileName]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  imageUrl:
                    type: string
                    format: uri
                    example: http://localhost:3333/uploads/9f1b2a-...jpg
                  fileName: { type: string }
        "400":
          description: Arquivo inválido (tipo, tamanho ou ausente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────────────────────────
  # Image Processing
  # ──────────────────────────────────────────────────────────────────

  /v1/images/process:
    post:
      tags: [Image Processing]
      operationId: processImage
      summary: Remove fundo e aplica sombra, devolvendo os bytes da imagem
      description: |
        Serviço **stateless** de processamento de imagem, reutilizável por
        sistemas externos (ex.: **Desmont Hub**). Recebe uma imagem via
        multipart, remove o fundo (via sidecar de IA) e opcionalmente aplica
        uma sombra de contato, devolvendo os **bytes** da imagem processada no
        corpo da resposta. **Nada é persistido** no servidor — o custo é apenas
        CPU/RAM durante a chamada.

        ## Quando usar
        - Recorte de foto de produto/peça (fundo transparente) e/ou sombra de
          contato, sem precisar do fluxo de cadastro de produto.

        ## Entrada
        - `file`: imagem `JPEG/PNG/WebP`, até **20 MB**.
        - `removeBackground` (opcional, default `true`): remove o fundo.
        - `addShadow` (opcional, default `false`): sombra de contato; **exige
          recorte** — é ignorada quando `removeBackground=false`.

        ## Saída
        - `200`: o **corpo é a imagem** processada (bytes). `Content-Type`
          `image/png` quando houve recorte, ou `image/webp` (otimizado/fallback).
          Os metadados vão em headers `X-*` (ver abaixo). A imagem é
          redimensionada para a janela **1000–1600 px**.

        ## Degradação graceful
        Se a remoção de fundo estiver indisponível, o endpoint **não falha**:
        devolve `200` com a imagem otimizada (`image/webp`),
        `X-Removed-Background: false` e um header `X-Warning`. Trate esse caso
        no seu cliente (ex.: reprocessar mais tarde).

        > Processamento pode levar alguns segundos (depende do sidecar de IA).
        > Use timeouts generosos e retry com backoff. O endpoint compartilha o
        > rate limit global (300 req/min por IP).
      security:
        - BearerAuth: []
        - EmailAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagem (JPEG/PNG/WebP, até 20 MB).
                removeBackground:
                  type: string
                  enum: ["true", "false"]
                  default: "true"
                  description: Remove o fundo via sidecar. Default `true`.
                addShadow:
                  type: string
                  enum: ["true", "false"]
                  default: "false"
                  description: |
                    Sombra de contato. Exige recorte — ignorada se
                    `removeBackground=false`. Default `false`.
      responses:
        "200":
          description: |
            Imagem processada — os **bytes** vêm no corpo; os metadados nos
            headers `X-*`.
          headers:
            X-Removed-Background:
              schema: { type: string, enum: ["true", "false"] }
              description: Se o fundo foi de fato removido.
            X-Shadow-Applied:
              schema: { type: string, enum: ["true", "false"] }
              description: Se a sombra de contato foi aplicada.
            X-Image-Format:
              schema: { type: string, enum: [png, webp] }
              description: Formato da imagem devolvida.
            X-Image-Width:
              schema: { type: integer }
              description: Largura em px (quando disponível).
            X-Image-Height:
              schema: { type: integer }
              description: Altura em px (quando disponível).
            X-Warning:
              schema: { type: string }
              description: |
                Presente **apenas** em degradação graceful (remoção de fundo
                indisponível). Ex.: "Remocao de fundo indisponivel; usamos a
                imagem otimizada original."
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Conta desativada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Conta desativada" }
        "500":
          $ref: "#/components/responses/InternalError"

# ────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT assinado (`Authorization: Bearer <jwt>`), verificado por
        [`api-token.ts`](../../app/lib/api-token.ts) (HS256). Caminho de auth
        preferido — funciona nos modos `legacy` e `strict` do
        [`auth.middleware.ts`](../../app/middlewares/auth.middleware.ts).
    EmailAuth:
      type: apiKey
      in: header
      name: email
      description: |
        Autenticação interna da API Fastify: o cliente envia o e-mail do
        usuário cadastrado no header `email`. O middleware
        [`auth.middleware.ts`](../../app/middlewares/auth.middleware.ts)
        valida o e-mail no banco (com cache in-memory de 60s) e anexa o `User`
        à requisição. Fallback aceito: query param `?email=`.

        > **Nota para Desmont Hub**: mecanismo legado; o caminho recomendado é o
        > `BearerAuth`. No modo `strict` (`API_AUTH_MODE=strict`) apenas o Bearer
        > é aceito. Encapsule a leitura/envio em seu cliente para minimizar
        > acoplamento.

  responses:
    BadRequest:
      description: Requisição malformada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }
    Unauthorized:
      description: Header `email` ausente ou usuário inexistente
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Email is required"
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponseWithMessage" }

  schemas:

    # ──── Generic ────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Mensagem curta de erro

    ErrorResponseWithMessage:
      type: object
      properties:
        error:
          type: string
          description: Categoria do erro (ex.- "Dados incompletos")
        message:
          type: string
          description: Detalhe legível para humanos

    # ──── Auth & Accounts ────────────────────────────────────────
    MarketplaceStatus:
      type: object
      required: [connected, platform, message]
      properties:
        connected: { type: boolean }
        platform: { type: string, enum: [MERCADO_LIVRE, SHOPEE] }
        status:
          type: string
          description: Status interno da conta (ACTIVE/REVOKED/...) quando conectada
        restricted:
          type: boolean
          description: Conta com restrições aplicadas pelo marketplace
        shopId:
          type: integer
          description: shopId do Shopee (apenas plataforma SHOPEE)
        message: { type: string }

    Account:
      type: object
      properties:
        id: { type: string }
        accountName: { type: string }
        platform: { type: string, enum: [MERCADO_LIVRE, SHOPEE] }
        status: { type: string }
        shopId: { type: integer, nullable: true }
        shopName: { type: string, nullable: true }
        region: { type: string, nullable: true }
        merchantName: { type: string, nullable: true }

    # ──── Products ───────────────────────────────────────────────
    Quality:
      type: string
      enum: [SUCATA, SEMINOVO, NOVO, RECONDICIONADO]

    CategorySource:
      type: string
      enum: [auto, manual, imported]
      description: Origem da escolha de categoria

    ProductAttributes:
      type: object
      description: |
        Mapa `{ [attributeId]: { value_id?, value_name? } }`. `attributeId` é
        o ID do atributo no ML (ex.- `BRAND`, `MODEL`, `PART_NUMBER`).
        Entradas com ambos `value_id` e `value_name` vazios são descartadas.
      additionalProperties:
        type: object
        properties:
          value_id: { type: string }
          value_name: { type: string }
      example:
        BRAND: { value_id: "9344", value_name: "Volkswagen" }
        PART_NUMBER: { value_name: "5U0121049" }

    Compatibility:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        brand: { type: string }
        model: { type: string }
        yearFrom: { type: integer, nullable: true }
        yearTo: { type: integer, nullable: true }
        version: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CompatibilityCreate:
      type: object
      required: [brand, model]
      properties:
        brand: { type: string }
        model: { type: string }
        yearFrom: { type: integer, nullable: true }
        yearTo: { type: integer, nullable: true }
        version: { type: string, nullable: true }

    ProductCreateListingItem:
      type: object
      required: [platform]
      description: |
        Configuração de UM anúncio a ser criado em background junto com o produto.
        Cada item gera N anúncios — um por `accountId` em `accountIds`.
      properties:
        platform:
          type: string
          enum: [MERCADO_LIVRE, SHOPEE]
        categoryId:
          type: string
          description: |
            categoryId no marketplace. Se omitido para ML, o sistema tenta resolver
            a partir de `mlCategory` do produto.
        accountIds:
          type: array
          items: { type: string }
          description: |
            Lista de `MarketplaceAccount.id`. Se vazio, o sistema usa a primeira
            conta ativa do marketplace.
        listingType:
          type: string
          example: gold_special
          description: "Apenas ML. Valores típicos: bronze, gold_special, gold_premium"
        hasWarranty: { type: boolean }
        warrantyUnit: { type: string, example: dias }
        warrantyDuration: { type: integer, example: 30 }
        itemCondition: { type: string, enum: [new, used] }
        shippingMode:
          type: string
          example: me2
          description: "Apenas ML. Valores: me2, me1, custom, not_specified"
        freeShipping: { type: boolean }
        localPickup: { type: boolean }
        manufacturingTime: { type: integer, description: dias para fabricar/preparar }

    ProductCreate:
      type: object
      required: [sku, name, price, stock, imageUrl]
      properties:
        sku:
          type: string
          maxLength: 50
          pattern: "^[A-Za-z0-9-_]+$"
          description: Único por usuário
          example: DEXO-00042
        name:
          type: string
          minLength: 3
          maxLength: 60
        description: { type: string, maxLength: 4000 }
        stock: { type: integer, minimum: 0 }
        price: { type: number, minimum: 0 }
        costPrice: { type: number, minimum: 0 }
        markup: { type: number, minimum: 0 }
        brand: { type: string }
        model: { type: string }
        year: { type: string, example: "2010" }
        version: { type: string }
        category: { type: string, description: "categoria interna (path legível)" }
        location: { type: string }
        locationId: { type: string }
        partNumber: { type: string }
        quality: { $ref: "#/components/schemas/Quality" }
        isSecurityItem: { type: boolean }
        isTraceable: { type: boolean }
        sourceVehicle: { type: string }
        mlCategory:
          type: string
          description: external category ID do ML (ex.- MLB252712)
        mlCategorySource: { $ref: "#/components/schemas/CategorySource" }
        shopeeCategory:
          type: string
          description: category_id do Shopee (numérico em string)
        shopeeCategorySource: { $ref: "#/components/schemas/CategorySource" }
        heightCm: { type: number, minimum: 0 }
        widthCm: { type: number, minimum: 0 }
        lengthCm: { type: number, minimum: 0 }
        weightKg: { type: number, minimum: 0 }
        imageUrl:
          type: string
          format: uri
          description: |
            URL retornada por `POST /upload/image`. Obrigatória.
        imageUrls:
          type: array
          items: { type: string, format: uri }
          description: Galeria de imagens adicionais
        attributes: { $ref: "#/components/schemas/ProductAttributes" }
        scrapId: { type: string, description: vínculo com sucata }
        mlCatalogProductId:
          type: string
          nullable: true
          description: catalog product ID do ML (ex.- MLB19765739)
        createListing:
          type: boolean
          description: |
            Atalho legado- cria 1 anúncio no ML usando `createListingCategoryId`.
            Prefira o array `listings` para multi-marketplace.
        createListingCategoryId: { type: string }
        listings:
          type: array
          items: { $ref: "#/components/schemas/ProductCreateListingItem" }
        compatibilities:
          type: array
          items: { $ref: "#/components/schemas/CompatibilityCreate" }

    Product:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        stock: { type: integer }
        price: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        costPrice: { type: number }
        markup: { type: number }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        year: { type: string, nullable: true }
        version: { type: string, nullable: true }
        category: { type: string, nullable: true }
        partNumber: { type: string, nullable: true }
        quality: { $ref: "#/components/schemas/Quality" }
        isSecurityItem: { type: boolean }
        isTraceable: { type: boolean }
        sourceVehicle: { type: string, nullable: true }
        mlCategory: { type: string, nullable: true }
        mlCategoryId: { type: string, nullable: true }
        mlCategorySource: { $ref: "#/components/schemas/CategorySource" }
        mlCategoryChosenAt: { type: string, format: date-time, nullable: true }
        shopeeCategoryId: { type: string, nullable: true }
        shopeeCategorySource: { $ref: "#/components/schemas/CategorySource" }
        shopeeCategoryChosenAt: { type: string, format: date-time, nullable: true }
        heightCm: { type: number, nullable: true }
        widthCm: { type: number, nullable: true }
        lengthCm: { type: number, nullable: true }
        weightKg: { type: number, nullable: true }
        imageUrl: { type: string, format: uri, nullable: true }
        imageUrls:
          type: array
          items: { type: string, format: uri }
        attributes: { $ref: "#/components/schemas/ProductAttributes" }
        mlCatalogProductId: { type: string, nullable: true }
        scrapId: { type: string, nullable: true }
        compatibilities:
          type: array
          items: { $ref: "#/components/schemas/Compatibility" }

    ProductCreateResponse:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            listing:
              type: object
              nullable: true
              description: |
                Snapshot do dispatch de anúncios. `null` se nenhum anúncio foi
                solicitado. `pending=true` indica que a criação está em background.
              properties:
                success: { type: boolean }
                pending: { type: boolean }
                message: { type: string }
            listingsResults:
              type: array
              description: |
                Resultados síncronos. Hoje **sempre vazio** porque a criação é
                fire-and-forget. Use `GET /listings/status` para acompanhar.
              items: { type: object }

    # ──── Listings ───────────────────────────────────────────────
    CreateMLListingRequest:
      type: object
      required: [productId, accountId]
      properties:
        productId: { type: string }
        accountId:
          type: string
          description: ID da MarketplaceAccount ML. Pode vir como query param `?accountId=` também.
        categoryId:
          type: string
          description: |
            Opcional. Se omitido, o sistema usa `product.mlCategoryId` ou pede sugestão ao ML.
        listingType: { type: string, example: gold_special }
        hasWarranty: { type: boolean }
        warrantyUnit: { type: string, example: dias }
        warrantyDuration: { type: integer }
        itemCondition: { type: string, enum: [new, used] }
        shippingMode: { type: string, example: me2 }
        freeShipping: { type: boolean }
        localPickup: { type: boolean }
        manufacturingTime: { type: integer }

    CreateShopeeListingRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
        accountId: { type: string, description: ID da MarketplaceAccount Shopee }
        categoryId:
          type: string
          description: |
            Categoria Shopee (numérica, em string). Deve ser **categoria folha**.

    CreateListingResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
        listingId:
          type: string
          description: ID interno do `ProductListing`
        externalListingId:
          type: string
          description: ID atribuído pelo marketplace (MLB#### ou item_id Shopee)

    DispatchListingsRequest:
      type: object
      required: [productId, requests]
      properties:
        productId: { type: string }
        requests:
          type: array
          minItems: 1
          items:
            type: object
            required: [platform]
            properties:
              platform:
                type: string
                enum: [MERCADO_LIVRE, SHOPEE]
              accountId: { type: string, nullable: true }
              categoryId: { type: string }
              mlSettings:
                type: object
                description: Apenas para platform=MERCADO_LIVRE
                properties:
                  listingType: { type: string }
                  hasWarranty: { type: boolean }
                  warrantyUnit: { type: string }
                  warrantyDuration: { type: integer }
                  itemCondition: { type: string }
                  shippingMode: { type: string }
                  freeShipping: { type: boolean }
                  localPickup: { type: boolean }
                  manufacturingTime: { type: integer }

    ListingsStatusResponse:
      type: object
      properties:
        productId: { type: string }
        listings:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              platform: { type: string, enum: [MERCADO_LIVRE, SHOPEE] }
              accountId: { type: string }
              accountName: { type: string }
              status:
                type: string
                description: |
                  Status interno do `ProductListing`. Valores típicos- ACTIVE,
                  PAUSED, PENDING (criação em andamento ou retry agendado),
                  ERROR, CLOSED.
              externalListingId: { type: string, nullable: true }
              permalink: { type: string, format: uri, nullable: true }
              lastError: { type: string, nullable: true }
              retryAttempts: { type: integer }
              retryEnabled: { type: boolean }
              nextRetryAt: { type: string, format: date-time, nullable: true }
              updatedAt: { type: string, format: date-time }

    # ──── Bulk listings ──────────────────────────────────────────
    BulkOverrideTemplate:
      type: object
      nullable: true
      description: |
        Aplicado a TODOS os produtos do lote. Permite ajustes mecânicos sem
        editar produtos individualmente. Pode ser `null` (não aplicar override).
      properties:
        titleSuffix: { type: string }
        priceFactor:
          type: number
          description: "Multiplicador aplicado ao preço (ex.- 1.10 = +10%)"
        stockFactor: { type: number }
      additionalProperties: true

    CreateBulkListingsRequest:
      type: object
      required: [productIds, requests]
      properties:
        productIds:
          type: array
          minItems: 1
          items: { type: string }
        requests:
          type: array
          minItems: 1
          items:
            type: object
            required: [platform, accountId]
            properties:
              platform: { type: string, enum: [MERCADO_LIVRE, SHOPEE] }
              accountId: { type: string }
              categoryId: { type: string }
              mlSettings: { type: object, additionalProperties: true }
        overrideTemplate:
          $ref: "#/components/schemas/BulkOverrideTemplate"

    BulkListingResultItem:
      type: object
      properties:
        productId: { type: string }
        platform: { type: string, enum: [MERCADO_LIVRE, SHOPEE] }
        accountId: { type: string }
        success: { type: boolean }
        listingId: { type: string }
        externalListingId: { type: string }
        error: { type: string }

    BulkListingJob:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          description: "Estados típicos- PENDING, RUNNING, FINISHED, CRASHED"
        totalItems: { type: integer }
        doneItems: { type: integer }
        successItems: { type: integer }
        failedItems: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkListingResultItem" }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ──── Categories & Catalog ───────────────────────────────────
    CategorySuggestion:
      type: object
      properties:
        categoryId: { type: string }
        categoryName: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        fullPath: { type: string }

    MLCatalogProduct:
      type: object
      properties:
        catalogProductId: { type: string }
        title: { type: string }
        categoryId: { type: string }
        domainId: { type: string }
        attributes:
          type: object
          additionalProperties: true
        compatibilities:
          type: array
          items:
            type: object
            properties:
              brand: { type: string }
              model: { type: string }
              yearFrom: { type: integer, nullable: true }
              yearTo: { type: integer, nullable: true }
              version: { type: string, nullable: true }

    CompatibilityValue:
      type: object
      properties:
        valueId: { type: string }
        valueName: { type: string }

externalDocs:
  description: |
    Guia de integração end-to-end para o Desmont Hub (passo-a-passo, exemplos
    cURL e Node.js, idempotência, webhooks, checklist de produção).
  url: ./guide.html
