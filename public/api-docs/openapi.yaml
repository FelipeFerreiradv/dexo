    get:
      tags: [Marketplace — Categories & Catalog]
      operationId: getMLCategoryAttributes
      summary: Ficha técnica (atributos) de uma categoria ML
      description: |
        Retorna a lista de atributos oficial do ML para a categoria. Use para
        montar um formulário dinâmico de ficha técnica antes de criar produto/anúncio.

        Endpoint **fail-open**: erros viram `200 { attributes: [] }`.

