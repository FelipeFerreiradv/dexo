          content:
            application/json:
              schema:
                type: object
                properties:
                  attributes:
                    type: array
                    items: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /marketplace/ml/category-suggest:
    get:
      tags: [Marketplace — Categories & Catalog]
      operationId: suggestMLCategory
      summary: Sugere categorias ML pelo título do produto
      description: |
        Usa um catálogo sincronizado de categorias e o título normalizado para
        retornar até N sugestões com `confidence`. **Heurístico** — não substitui
        validação humana ou busca pelo `category_predictor` oficial do ML.
      parameters:
        - name: title
