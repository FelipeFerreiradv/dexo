<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>GHD Platform — API docs</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      type="image/x-icon"
    />
    <style>
      html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
      *, *::before, *::after { box-sizing: inherit; }
      body { margin: 0; background: #fafafa; }
      .topbar { background: #1f2937 !important; }
      .topbar .download-url-wrapper { display: none !important; }
      #swagger-ui { max-width: 1280px; margin: 0 auto; }
      .ghd-banner {
        max-width: 1280px;
        margin: 16px auto 0;
        padding: 12px 20px;
        background: #fff7ed;
        border-left: 4px solid #f59e0b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        color: #78350f;
      }
      .ghd-banner code {
        background: #fde68a;
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="ghd-banner">
      <strong>GHD Platform — Documentação interna.</strong>
      Para integração externa (Desmont Hub), comece pelo
      <a href="../docs/api/INTEGRATION-GUIDE.md">guia de integração</a>.
      Esta página é gerada estaticamente a partir de
      <code>docs/api/openapi.yaml</code>.
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset.slice(1)
          ],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: "StandaloneLayout",
          docExpansion: "list",
          defaultModelsExpandDepth: 1,
          defaultModelExpandDepth: 2,
          tagsSorter: "alpha",
          operationsSorter: "alpha",
          tryItOutEnabled: true,
          persistAuthorization: true
        });
      };
    </script>
  </body>
</html>
